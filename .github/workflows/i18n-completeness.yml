# Installed as .github/workflows/i18n-completeness.yml in each repo that holds
# English. Copy it byte for byte from exercism/i18n/source-repo-workflows/.
# Keep the filename, because exercism/i18n's rerun-source-check.yml finds this
# workflow's runs by it.
#
# The check fails while exercism/i18n is missing a translation of English that
# the PR changes. The logic lives in
# exercism/i18n/.github/workflows/source-completeness.yml, which explains how
# it reads the PR without checking it out. This file holds only the trigger and
# the permissions.
#
# The status context is `i18n / completeness`, the name to require on `main`.

name: i18n completeness

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  i18n:
    permissions:
      contents: read
    uses: exercism/i18n/.github/workflows/source-completeness.yml@main
