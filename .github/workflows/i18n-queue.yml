# Installed as .github/workflows/i18n-queue.yml in each repo that holds
# English. Copy it byte for byte from exercism/i18n/source-repo-workflows/.
#
# When a maintainer adds `ready-to-translate` to a PR, this opens an issue in
# exercism/i18n to translate the PR's English. The logic lives in
# exercism/i18n/.github/workflows/source-queue.yml, which explains every job
# and why it is fork-safe. This file holds only the trigger and the
# permissions the called jobs may use.
#
# `pull_request_target` gives fork PRs this repo's secrets, and nothing here
# checks out or runs the PR's code. The called workflow checks out only
# exercism/i18n at main. `secrets: inherit` passes on the organisation secret
# EXERCISM_I18N_APP_PRIVATE_KEY, from which the called jobs mint a token for
# exercism/i18n issues.

name: i18n queue

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize]
    branches: [main]

permissions: {}

jobs:
  i18n:
    permissions:
      contents: read
      pull-requests: write
    uses: exercism/i18n/.github/workflows/source-queue.yml@main
    secrets: inherit
